[package]
name = "ralph-loop-junkie"
version = "0.1.0"
description = "A basic Tauri shell for Ralph Loop Junkie."
authors = ["Jordan Dalton"]
license = ""
repository = ""
edition = "2021"
default-run = "ralph-loop-junkie"

[lib]
name = "ralph_loop_junkie_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "^2.0.0", features = [] }

[dependencies]
tauri = { version = "^2.0.0", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
